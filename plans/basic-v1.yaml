    difficulty: medium
    tags:
      - flow-control
    origin_level: interview
    source: 计算机网络 > TCP > TCP流量控制
    note: 接收窗口随 ACK 滑动，发送方可发送的字节数由窗口决定；窗口缩小时发送速率下降，为 0 时暂停并探测
