    tags:
      - reliable-transmission
    origin_level: interview
    source: 计算机网络 > TCP > TCP如何保证可靠性
    note: 在 IP 不可靠的基础上，TCP 通过序号与确认、超时重传、校验和、流量控制和拥塞控制等机制共同保证可靠
