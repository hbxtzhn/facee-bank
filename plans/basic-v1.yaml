    origin_level: interview
    source: 计算机网络 > TCP > 四次挥手
    note: 主动方发 FIN 进入 FIN_WAIT_1，被动方回 ACK 进入 CLOSE_WAIT，被动方数据发完再发 FIN，主动方回 ACK，经 TIME_WAIT 后关闭
    importance: 3
