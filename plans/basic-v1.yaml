    difficulty: easy
    tags:
      - reliable-transmission
      - ip-addressing
    origin_level: basic
    source: 计算机网络 > TCP > TCP如何保证可靠性 > 最大消息长度
    note: 建立连接时双方约定的单个 TCP 报文段可携带的最大数据长度，重传也以它为单位
    importance: 1
    id: q_01M6XCE87QQ4VY4HV8K7RVVAGK
