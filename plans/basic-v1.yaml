    tags:
      - congestion-control
    origin_level: basic
    source: 计算机网络 > TCP > TCP拥塞控制
    note: 发送方自己维护的发送量上限，随网络拥塞情况变化；实际发送窗口取拥塞窗口与接收窗口中的较小值
