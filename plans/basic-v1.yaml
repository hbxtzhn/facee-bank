    source: 计算机网络 > TCP > 四次挥手 > 为什么挥手需要四次
    note: 收到 FIN 只代表对方不再发数据，被动方可能还有数据要发，所以 ACK 和 FIN 分开发送
    importance: 3
    id: q_01M6XCE6DAJYDD9EG25WRGDFWA
    prerequisites: [ b1-0608, b1-0609 ]
