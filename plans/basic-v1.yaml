    category: ai-engineering
    difficulty: medium
    tags:
      - rag-pipeline
    origin_level: interview
    source: AI核心概念 > RAG > 文档处理与切分 > 关键原则
    note: 小块检索更精准但上下文易残缺；大块保留完整语境但会引入噪声并占用窗口，需要结合 Embedding 输入长度和召回粒度权衡
    importance: 2
    id: q_01M6XCGJV3B0KHH4M9R4DATHBF
    prerequisites: [ b1-0780 ]
  - key: b1-0783
    title: 什么是关键词检索？
    category: ai-engineering
    difficulty: easy
    tags:
      - retrieval-strategy
    origin_level: basic
    source: AI核心概念 > RAG > 混合检索
    note: 按查询词是否出现在文档中打分排序（如 BM25），擅长精确的词匹配
    importance: 2
    id: q_01M6XCGKDFTH8DYNDMJNXHCRBR
  - key: b1-0784
    title: 为什么要混合向量检索和关键词检索？
    category: ai-engineering
    difficulty: medium
    tags:
      - retrieval-strategy
      - vector-search
    origin_level: interview
    source: AI核心概念 > RAG > 混合检索 > 向量检索加关键词检索
    note: 向量检索擅长语义相似但对精确术语、编号、专有名词不稳定，BM25 恰好相反，两者互补提高召回
    importance: 3
    prerequisites: [ b1-0772, b1-0783 ]
    id: q_01M6ZYK8Q0AQ35CCDDWX82PRKZ
  - key: b1-0785
    title: RRF（倒数排名融合）是怎样合并两路检索结果的？
    category: ai-engineering
    difficulty: medium
    tags:
      - retrieval-strategy
    origin_level: interview
    source: AI核心概念 > RAG > 混合检索 > 向量检索加关键词检索
    note: RRF 对每路结果按排名计算 1/(k+rank) 并求和，只依赖排名不依赖分数，因此不同检索器的分数无需归一化
    importance: 2
    id: q_01M6XCHNCSD2E0GP3CPEDRSHTV
    prerequisites: [ b1-0784 ]
  - key: b1-0786
    title: 什么是查询改写（Query Rewriting）？
    category: ai-engineering
    difficulty: easy
    tags:
      - retrieval-strategy
    origin_level: basic
    source: AI核心概念 > RAG > 查询改写
    note: 检索前把用户的问题改写成更利于检索的形式，例如补全指代、规范化表达
    importance: 2
    id: q_01M6XCHNW5V9TNXR9G1RNCDTT5
  - key: b1-0787
    title: 常见查询改写策略各解决什么问题？
    category: ai-engineering
    difficulty: medium
    tags:
      - retrieval-strategy
    origin_level: interview
    source: AI核心概念 > RAG > 查询改写 > 多种改写策略
    note: 规范化改写统一表述；Multi-Query 从多角度生成查询扩大召回；Query Decomposition 把复杂问题拆成子问题；Step-back 先问更抽象的问题；HyDE 让模型生成假设答案再用其向量检索
    importance: 2
    id: q_01M6XCHPCGPNGS3HHVMCN4TTAG
    prerequisites: [ b1-0772, b1-0786 ]
  - key: b1-0788
    title: 什么是重排序（Rerank）？
    category: ai-engineering
    difficulty: easy
    tags:
      - retrieval-strategy
    origin_level: basic
    source: AI核心概念 > RAG > 重排序
    note: 用更精细的模型对初步召回的候选片段重新打分排序，只保留最相关的若干条
    importance: 3
    id: q_01M6XCHPXADXR8Y1QD1ERPX6HX
  - key: b1-0789
    title: Cross-Encoder 重排序为什么比向量相似度更准？
    category: ai-engineering
    difficulty: medium
    tags:
      - retrieval-strategy
      - vector-search
    origin_level: interview
    source: AI核心概念 > RAG > 重排序 > 精细打分提升相关性
    note: Cross-Encoder 把查询和候选文本一起输入模型做交互式计算，能判断是否真正回答问题；向量相似度只比较各自的向量，更多反映主题是否相近
    importance: 2
    id: q_01M6XCHQEQW5G3X5PSZD6TXQM3
    prerequisites: [ b1-0772, b1-0788 ]
  - key: b1-0790
    title: 什么是知识图谱？
    category: ai-engineering
    difficulty: easy
    tags:
      - retrieval-strategy
    origin_level: basic
    source: AI核心概念 > RAG > GraphRAG
    note: 用节点表示实体、用边表示实体之间关系组成的图结构
    importance: 1
    id: q_01M6ZYK9B70TE26W6ARWW4RKEK
  - key: b1-0791
    title: GraphRAG 为什么适合多跳推理，它的检索对象是什么？
    category: ai-engineering
    difficulty: medium
    tags:
      - retrieval-strategy
      - rag-pipeline
    origin_level: interview
    source: AI核心概念 > RAG > GraphRAG > 检索实体关系路径
    note: GraphRAG 把实体和关系建模为图，多跳推理时沿边收集证据，检索对象是节点、边、路径和社区摘要，适合跨文档归纳
    importance: 2
    prerequisites: [ b1-0790 ]
    id: q_01M6ZYK9WCZFD279RQZZ2R00RW
  - key: b1-0792
    title: 检索的召回率是什么意思？
    category: ai-engineering
    difficulty: easy
    tags:
      - retrieval-evaluation
    origin_level: basic
    source: AI核心概念 > RAG > 评估指标 > 召回率与命中率
    note: 在检索结果中，找回了多少比例的相关文档
    importance: 2
    id: q_01M6ZYKAFTP9KK49Q3TPBANY80
  - key: b1-0793
    title: 检索的命中率（Hit Rate）是什么意思？
    category: ai-engineering
    difficulty: easy
    tags:
      - retrieval-evaluation
    origin_level: basic
    source: AI核心概念 > RAG > 评估指标 > 召回率与命中率
    note: 检索结果前 K 条中至少包含一条相关文档的查询所占比例
    importance: 1
    id: q_01M6XCGM402B3MHY0DMJBW71GC
  - key: b1-0794
    title: MRR（平均倒数排名）是怎样衡量检索排序质量的？
    category: ai-engineering
    difficulty: medium
    tags:
      - retrieval-evaluation
    origin_level: interview
    source: AI核心概念 > RAG > 评估指标 > 召回率与命中率
    note: MRR 是每个查询第一个相关结果排名倒数的平均值，只关注第一个相关结果出现得多靠前，反映排序质量
    importance: 1
    id: q_01M6XCGMKDYPH9KYE90JB3MTRN
    prerequisites: [ b1-0792, b1-0793 ]
  - key: b1-0795
    title: RAG 答案的忠实度（Faithfulness）是什么意思？
    category: ai-engineering
    difficulty: easy
    tags:
      - retrieval-evaluation
      - hallucination
    origin_level: basic
    source: AI核心概念 > RAG > 评估指标 > 答案质量指标
    note: 答案里的内容是否都能在检索到的上下文中找到依据
    importance: 2
    id: q_01M6XCGN3VR8MNH6FYZE8ZQ7C2
    prerequisites: [ b1-0756, b1-0771 ]
  - key: b1-0796
    title: 答案相关性（Answer Relevancy）怎样衡量？
    category: ai-engineering
    difficulty: medium
    tags:
      - retrieval-evaluation
    origin_level: interview
    source: AI核心概念 > RAG > 评估指标 > 答案质量指标
    note: 衡量答案是否切中用户问题，常用做法是让 LLM 或人工判断答案对问题的覆盖与相关程度
    importance: 2
    id: q_01M6XCGNNN5W7V854CKTGF2K67
    prerequisites: [ b1-0771 ]
