    difficulty: easy
    tags:
      - reliable-transmission
    origin_level: basic
    source: 计算机网络 > TCP > TCP如何保证可靠性 > 校验和
    note: 接收方用它检测报文在传输中是否被改动，校验失败的报文会被丢弃且不予确认
