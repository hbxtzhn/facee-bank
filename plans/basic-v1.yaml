    tags:
      - tcp-connection
    origin_level: interview
    source: 计算机网络 > TCP > TCP如何保证可靠性 > 连接管理
    note: TCP 连接在 CLOSED、LISTEN、SYN_SENT、SYN_RCVD、ESTABLISHED、FIN_WAIT、CLOSE_WAIT、LAST_ACK、TIME_WAIT 等状态之间按握手和挥手转换
