    difficulty: easy
    tags:
      - congestion-control
    origin_level: basic
    source: 计算机网络 > TCP > TCP拥塞控制
    note: 网络中同时发送的数据太多时会出现排队、丢包和延迟升高，发送方要主动降低发送量来保护网络
