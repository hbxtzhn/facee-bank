    difficulty: easy
    tags:
      - tcp-connection
    origin_level: basic
    source: 计算机网络 > TCP > 四次挥手
    note: 连接的两个方向各自独立，可以同时收发数据；一方发送 FIN 只表示它自己不再发送，另一方仍可继续发送
