      - tcp-connection
    origin_level: interview
    source: 计算机网络 > TCP > 三次握手
    note: 客户端发 SYN（带初始序号 x），服务端回 SYN+ACK（带自己的序号 y、确认号 x+1），客户端回 ACK（确认号 y+1），双方进入 ESTABLISHED
    importance: 3
    id: q_01M6XCE5D8116WBX8EXNZZGK6Z
