    difficulty: easy
    tags:
      - flow-control
    origin_level: basic
    source: 计算机网络 > TCP > TCP流量控制
    note: 接收方的处理和缓冲能力有限，流量控制让发送方的速度不超过接收方能接收的数据量
    importance: 2
    id: q_01M6XCE8GB39Q3KM9QT950KZZ6
