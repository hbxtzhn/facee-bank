# 标签定义（含范围说明和别名）。CLI 支持 description / aliases 之前，bank.yaml 只同步 id / name / parent
- id: language-runtime
  name: 语言与运行时
  parent: null
  description: 包括面向对象、语言类型、对象方法、异常、反射、字节码执行与类加载；不包括内存与 GC（见 memory-management）、并发（见 concurrency）
  aliases:
  - 语言基础
  - 编程语言
  - 运行时
- id: oop
  name: 面向对象
  parent: language-runtime
  description: 包括类与对象、封装、继承、多态、方法重载与重写、抽象类与接口、构造方法、this、static；不包括对象拷贝与 equals/hashCode（见 object-methods）
  aliases:
  - 封装
  - 继承
  - 多态
  - 重载
  - 重写
  - Overload
  - Override
  - 抽象类
  - 接口
  - static
  - this
- id: type-system
  name: 语言数据类型
  parent: language-runtime
  description: 包括编程语言内置类型：Java 基本/引用/包装类型、自动装箱、泛型、String 不可变与 StringBuilder/StringBuffer；不包括 Redis 的数据类型（见 redis-data-types）
  aliases:
  - 基本数据类型
  - 引用类型
  - 包装类
  - 自动装箱
  - 拆箱
  - 泛型
  - Java String
  - StringBuilder
  - StringBuffer
- id: object-methods
  name: 对象拷贝与相等
  parent: language-runtime
  description: 包括 Object 的 clone（浅拷贝/深拷贝）、equals 与 hashCode 及其重写约定；不包括哈希表结构（见 hash-table）
  aliases:
  - 深拷贝
  - 浅拷贝
  - clone
  - Cloneable
  - equals
  - hashCode
- id: exception
  name: 异常处理
  parent: language-runtime
  description: 包括异常分类（Error/受检/运行时）、throw/throws、try-catch，以及异常对事务回滚的影响；不包括事务失效的其他原因（见 transaction-management）
  aliases:
  - 异常
  - Error
  - 受检异常
  - RuntimeException
  - try-catch
  - throws
- id: reflection
  name: 反射
  parent: language-runtime
  description: 包括反射的用法与原理（Class 对象、Method.invoke），以及框架用反射创建对象、映射属性；不包括动态代理（见 dynamic-proxy）
  aliases:
  - Class 对象
  - Method.invoke
- id: bytecode-execution
  name: 字节码与执行引擎
  parent: language-runtime
  description: 包括平台无关性、JDK/JRE/JVM 关系、字节码、解释执行与 JIT 编译；不包括类加载过程（见 class-loading）
  aliases:
  - 字节码
  - JIT
  - 即时编译
  - 解释执行
  - 跨平台
  - JDK
  - JRE
- id: class-loading
  name: 类加载
  parent: language-runtime
  description: 包括类加载的阶段、类加载器、双亲委派及打破方式；不包括对象创建与内存分配（见 memory-area）
  aliases:
  - 类加载器
  - 双亲委派
  - ClassLoader
  - 加载链接初始化
- id: memory-management
  name: 内存管理
  parent: null
  description: 包括运行时内存区域与对象分配、垃圾回收、OOM 与性能排查、操作系统虚拟内存；不包括缓存淘汰与页面置换算法（见 replacement-policy）
  aliases:
  - 内存
- id: memory-area
  name: 内存区域与对象分配
  parent: memory-management
  description: 包括堆、栈、程序计数器、方法区、常量池、直接内存及版本变化，以及 new 对象过程、Eden/Survivor 分配、晋升老年代、逃逸分析；不包括回收算法（见 gc-algorithm）
  aliases:
  - 运行时数据区
  - 堆
  - 栈
  - 方法区
  - 元空间
  - 程序计数器
  - 直接内存
  - 对象创建
  - 晋升
  - 逃逸分析
  - TLAB
- id: gc-algorithm
  name: 垃圾回收基础
  parent: memory-management
  description: 包括垃圾判定（可达性、GC Roots）、回收算法、分代回收、Minor/Full GC 触发、四种引用；不包括具体收集器（见 gc-collector）
  aliases:
  - GC
  - 垃圾回收
  - GC Roots
  - 可达性分析
  - 标记清除
  - 复制算法
  - 标记整理
  - 分代回收
  - Minor GC
  - Full GC
  - 强软弱虚引用
- id: gc-collector
  name: 垃圾收集器
  parent: memory-management
  description: 包括 Serial、Parallel、CMS、G1 等收集器的流程、STW、Mixed GC 与选型；不包括通用回收算法（见 gc-algorithm）
  aliases:
  - CMS
  - G1
  - ZGC
  - Serial
  - Parallel
  - STW
  - Stop-The-World
  - Mixed GC
- id: performance-diagnosis
  name: OOM 与性能排查
  parent: memory-management
  description: 包括 OOM 类型、内存泄漏成因与排查、JVM 调优参数、诊断工具、Heap Dump、频繁 GC 与 CPU 飙高排查；不包括慢 SQL（见 sql-optimization）、热 key/大 key（见 hot-big-key）
  aliases:
  - OOM
  - OutOfMemoryError
  - 内存溢出
  - 内存泄漏
  - JVM 调优
  - jstack
  - jmap
  - Arthas
  - Heap Dump
  - CPU 飙高
- id: virtual-memory
  name: 虚拟内存与分页
  parent: memory-management
  description: 包括虚拟/物理地址、分段与分页、页表与多级页表、TLB、swap、缺页中断、写时复制；不包括页面置换算法（见 replacement-policy）
  aliases:
  - 虚拟内存
  - 虚拟地址
  - 内存分页
  - 分段
  - 页表
  - 多级页表
  - TLB
  - 快表
  - swap
  - 缺页中断
  - 写时复制
  - COW
- id: concurrency
  name: 并发控制
  parent: null
  description: 包括线程使用、线程安全与同步原语、内存可见性、各类锁与原子操作、死锁及分布式锁；不包括事务隔离（见 transaction）
  aliases:
  - 并发
  - 多线程
- id: thread-basics
  name: 线程基础与协作
  parent: concurrency
  description: 包括线程创建方式与对比、sleep/yield/join、中断、wait/notify、Condition、管道流等线程间协作；不包括进程间通信（见 ipc）、OS 线程实现（见 thread-model）
  aliases:
  - 线程创建
  - Thread
  - Runnable
  - Callable
  - sleep
  - Thread.join
  - interrupt
  - wait
  - notify
  - Condition
  - 线程通信
- id: thread-pool
  name: 线程池
  parent: concurrency
  description: 包括线程池作用、核心参数、任务提交流程、阻塞队列、拒绝策略、状态与关闭；不包括线程本身的创建（见 thread-basics）
  aliases:
  - ThreadPoolExecutor
  - 线程池参数
  - 核心线程数
  - 拒绝策略
  - 阻塞队列
- id: thread-safety
  name: 线程安全与同步原语
  parent: concurrency
  description: 包括共享数据为何出错、线程安全的含义与单例 Bean 等场景，以及临界区、互斥锁、自旋锁、信号量、PV 操作等通用同步原语；不包括 Java 具体锁实现（见 synchronized、aqs）
  aliases:
  - 线程安全
  - 竞态条件
  - 临界区
  - 互斥锁
  - Mutex
  - 信号量
  - Semaphore
  - PV 操作
  - 自旋锁
- id: thread-local
  name: ThreadLocal
  parent: concurrency
  description: 包括 ThreadLocal 用法、ThreadLocalMap 结构、弱引用与内存泄漏、父子线程传递；不包括一般内存泄漏（见 performance-diagnosis）
  aliases:
  - ThreadLocalMap
  - InheritableThreadLocal
  - 线程本地变量
- id: memory-model
  name: 内存模型与 volatile
  parent: concurrency
  description: 包括 JMM、原子性/可见性/有序性、指令重排序、happens-before、volatile 及内存屏障；不包括锁的实现（见 synchronized）
  aliases:
  - JMM
  - Java 内存模型
  - 可见性
  - 有序性
  - 指令重排
  - happens-before
  - volatile
  - 内存屏障
- id: synchronized
  name: synchronized
  parent: concurrency
  description: 包括 synchronized 用法、monitor、锁升级（偏向/轻量/重量级）及与 ReentrantLock 对比；不包括 AQS 系列锁（见 aqs）
  aliases:
  - monitor
  - 锁升级
  - 偏向锁
  - 轻量级锁
  - 重量级锁
  - Mark Word
- id: aqs
  name: AQS 与显式锁
  parent: concurrency
  description: 包括 AQS 原理、ReentrantLock、可重入、公平/非公平锁；不包括 synchronized（见 synchronized）、CAS（见 atomic-operation）
  aliases:
  - ReentrantLock
  - 可重入锁
  - 公平锁
  - 非公平锁
  - Lock
- id: atomic-operation
  name: 原子操作与 CAS
  parent: concurrency
  description: 包括 CAS 原理、ABA、自旋开销、原子类，以及 Redis INCR、Lua 脚本、MULTI/EXEC 等把多步操作做成不可打断的手段；不包括乐观/悲观锁的选型（见 optimistic-pessimistic-lock）
  aliases:
  - CAS
  - Compare And Swap
  - ABA
  - AtomicInteger
  - 原子类
  - 原子递增
  - INCR
  - Lua 脚本
  - 操作原子性
- id: optimistic-pessimistic-lock
  name: 乐观锁与悲观锁
  parent: concurrency
  description: 包括乐观锁与悲观锁的思想、实现（版本号、CAS、SELECT … FOR UPDATE）与场景选择；不包括 CAS 细节（见 atomic-operation）
  aliases:
  - 乐观锁
  - 悲观锁
  - 版本号
  - FOR UPDATE
- id: lock-modes
  name: 锁模式与锁粒度
  parent: concurrency
  description: 包括共享锁/排他锁、读写锁（含 Redisson 读写锁）、意向锁、表锁与行锁、记录锁、间隙锁、临键锁、插入意向锁；不包括死锁（见 deadlock）
  aliases:
  - 共享锁
  - 排他锁
  - 读写锁
  - 意向锁
  - 表锁
  - 行锁
  - 记录锁
  - 间隙锁
  - Next-Key Lock
  - 插入意向锁
- id: deadlock
  name: 死锁
  parent: concurrency
  description: 包括死锁概念、四个必要条件、避免与排查（线程与数据库），以及饥饿、活锁；不包括一般锁的实现（见 aqs、lock-modes）
  aliases:
  - 活锁
  - 饥饿
  - 死锁排查
- id: distributed-lock
  name: 分布式锁
  parent: concurrency
  description: 包括分布式锁需求、SET NX、续期与看门狗、Redisson 实现、主从切换问题、RedLock、ZooKeeper 锁；不包括单机锁（见 aqs、synchronized）
  aliases:
  - SET NX
  - Redisson
  - 看门狗
  - watch dog
  - RedLock
  - 红锁
- id: transaction
  name: 事务
  parent: null
  description: 包括事务特性、隔离与 MVCC、框架中的事务管理、分布式事务；不包括锁的实现（见 concurrency）
  aliases: []
- id: transaction-basics
  name: 事务基础
  parent: transaction
  description: 包括 ACID 含义与保障方式、存储引擎对事务的支持、Redis 事务（MULTI/EXEC）的语义；不包括隔离级别（见 isolation-mvcc）
  aliases:
  - ACID
  - 事务原子性
  - 一致性
  - 持久性
  - MULTI
  - EXEC
- id: isolation-mvcc
  name: 隔离级别与 MVCC
  parent: transaction
  description: 包括四种隔离级别、脏读/不可重复读/幻读、隔离实现、MVCC 版本链、ReadView 与可见性判断；不包括间隙锁等锁（见 lock-modes）
  aliases:
  - 隔离级别
  - 脏读
  - 不可重复读
  - 幻读
  - 读已提交
  - 可重复读
  - MVCC
  - ReadView
  - 版本链
  - 快照读
- id: transaction-management
  name: 事务管理与失效
  parent: transaction
  description: 包括声明式/编程式事务、@Transactional、传播行为、代理创建时机、事务管理器、MyBatis 提交，以及异常被吞、自调用等失效场景；不包括数据库隔离实现（见 isolation-mvcc）
  aliases:
  - '@Transactional'
  - 声明式事务
  - 编程式事务
  - 事务传播
  - REQUIRED
  - REQUIRES_NEW
  - 事务失效
  - 事务不回滚
- id: distributed-transaction
  name: 分布式事务
  parent: transaction
  description: 包括 2PC、TCC、事务消息、Exactly Once，以及 redo log 与 binlog 的两阶段提交思路；不包括消息幂等（见 idempotency）
  aliases:
  - 2PC
  - 两阶段提交
  - TCC
  - 事务消息
  - Seata
  - 最终一致
- id: persistence
  name: 持久化与日志
  parent: null
  description: 包括内存数据落盘、数据库日志与崩溃恢复、消息落盘；不包括主从复制（见 replication）
  aliases:
  - 持久化
  - 落盘
  - 日志
- id: rdb-aof
  name: RDB 与 AOF
  parent: persistence
  description: 包括 RDB 快照与 bgsave、AOF 记录/重写/同步策略、两者对比与重启恢复；不包括通用刷盘原理（见 flush-to-disk）
  aliases:
  - RDB
  - AOF
  - 快照
  - bgsave
  - bgrewriteaof
  - appendfsync
- id: database-log
  name: 数据库日志
  parent: persistence
  description: 包括 redo log、undo log、binlog 的作用与区别，UPDATE 执行中的写日志过程；不包括刷盘时机细节（见 flush-to-disk）、主从复制流程（见 replication）
  aliases:
  - redo log
  - undo log
  - binlog
  - WAL
  - 重做日志
  - 回滚日志
  - 二进制日志
- id: flush-to-disk
  name: 刷盘策略
  parent: persistence
  description: 包括页缓存与 fsync、何时真正落盘，以及 redo log、AOF、MQ Broker 的刷盘策略与顺序写；不包括各日志本身（见 database-log、rdb-aof）
  aliases:
  - 刷盘
  - fsync
  - Page Cache
  - 同步刷盘
  - 异步刷盘
  - 顺序写
- id: index
  name: 索引
  parent: null
  description: 包括索引结构、聚簇与二级索引、索引设计与失效；不包括执行计划与慢查询（见 sql-optimization）
  aliases: []
- id: index-structure
  name: 索引结构与类型
  parent: index
  description: 包括索引原理、索引类型、哈希索引、B+ 树及与 B 树的对比、建删索引；不包括聚簇/二级索引存储（见 clustered-index）
  aliases:
  - 索引类型
  - B+ 树
  - B 树
  - 哈希索引
  - 主键索引
  - 唯一索引
  - 页分裂
- id: clustered-index
  name: 聚簇索引与回表
  parent: index
  description: 包括聚簇/二级索引的存储、回表、覆盖索引；不包括联合索引规则（见 index-design）
  aliases:
  - 聚簇索引
  - 非聚簇索引
  - 二级索引
  - 回表
  - 覆盖索引
- id: index-design
  name: 索引设计与失效
  parent: index
  description: 包括选列、索引数量、主键选择、前缀索引、联合索引与最左前缀、索引下推、索引失效场景；不包括索引结构（见 index-structure）
  aliases:
  - 建索引原则
  - 前缀索引
  - 联合索引
  - 最左前缀
  - 索引下推
  - ICP
  - 索引失效
- id: sql-query
  name: SQL 与查询优化
  parent: null
  description: 包括 SQL 语法、存储引擎与执行流程、慢查询与写法优化、分页；不包括索引本身（见 index）
  aliases:
  - SQL
  - 查询优化
- id: sql-basics
  name: SQL 基础语法
  parent: sql-query
  description: 包括建库建表、JOIN、子查询、UNION 等基本写法；不包括性能优化（见 sql-optimization）
  aliases:
  - DDL
  - DML
  - SQL JOIN
  - 子查询
  - UNION
  - 建表
- id: query-execution
  name: 存储引擎与执行流程
  parent: sql-query
  description: 包括存储引擎及 InnoDB/MyISAM 对比、Server 层与引擎层、SELECT/UPDATE 执行流程、ORDER BY 排序过程；不包括执行计划分析（见 sql-optimization）
  aliases:
  - 存储引擎
  - InnoDB
  - MyISAM
  - 执行流程
  - 优化器
  - 执行器
  - filesort
- id: sql-optimization
  name: 慢查询与 SQL 优化
  parent: sql-query
  description: 包括 EXPLAIN、慢查询定位与监控、SELECT *、子查询与 JOIN 优化、小表驱动大表、N+1 等 SQL 写法问题；不包括分页（见 pagination）
  aliases:
  - EXPLAIN
  - 执行计划
  - 慢查询
  - 慢 SQL
  - SQL 优化
  - 小表驱动大表
  - JOIN 优化
- id: pagination
  name: 分页查询
  parent: sql-query
  description: 包括 LIMIT/OFFSET、深分页优化（延迟关联、书签）、内存分页与物理分页、PageHelper；不包括一般 SQL 优化（见 sql-optimization）
  aliases:
  - LIMIT
  - OFFSET
  - 深分页
  - PageHelper
  - RowBounds
- id: data-access
  name: 数据访问与 ORM
  parent: null
  description: 包括 JDBC、连接池、ORM 框架的使用与原理；不包括 IoC/AOP 等通用框架机制（见 framework）
  aliases:
  - 持久层
  - 数据访问
- id: orm
  name: ORM 与 JDBC
  parent: data-access
  description: 包括 ORM 概念、JDBC、连接池、MyBatis 半自动特点、与 Hibernate 对比、MyBatis-Plus；不包括 MyBatis 内部执行（见 mybatis-internals）
  aliases:
  - JDBC
  - 连接池
  - MyBatis
  - Hibernate
  - MyBatis-Plus
  - JPA
- id: mybatis-internals
  name: MyBatis 执行原理
  parent: data-access
  description: 包括 SqlSessionFactory/SqlSession 生命周期与构建、Mapper 接口与映射文件、MapperProxy 调用链、Executor 与批处理、四大 Handler、Spring 整合；不包括参数/结果映射规则（见 sql-mapping）
  aliases:
  - SqlSession
  - SqlSessionFactory
  - SqlSessionTemplate
  - Mapper
  - MapperProxy
  - MapperMethod
  - MyBatis Executor
  - BatchExecutor
  - StatementHandler
- id: sql-mapping
  name: 参数与结果映射
  parent: data-access
  description: 包括多参数与 @Param、#{} 与 ${}（SQL 注入）、LIKE 写法、主键回填、resultMap、驼峰映射、TypeHandler、鉴别器；不包括关联映射（见 association-mapping）
  aliases:
  - '#{}'
  - ${}
  - '@Param'
  - SQL 注入
  - resultMap
  - TypeHandler
  - 驼峰映射
  - useGeneratedKeys
- id: dynamic-sql
  name: 动态 SQL
  parent: data-access
