    difficulty: easy
    tags:
      - flow-control
    origin_level: basic
    source: 计算机网络 > TCP > TCP流量控制
    note: 接收方缓冲区里剩余可用的字节数，随确认一起告诉发送方；窗口为 0 时发送方暂停发送并定时询问
